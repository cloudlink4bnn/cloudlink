<!DOCTYPE html>
<html>
<head>
    <title>CloudLink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">

    <div class="topbar">
        CloudLink
    </div>

    <div class="center">

        <h1>CloudLink</h1>

        <p>
            Private Access Portal
        </p>

        <input
            type="password"
            id="codeInput"
            placeholder="Access Code">

        <br>

        <button onclick="checkCode()">
            Enter
        </button>

        <p id="message"></p>

    </div>

</div>

<script>

function checkCode(){

    var code =
    document.getElementById("codeInput").value;

    if(code === "bnn*1017"){
        window.location.href = "home.html";
    }

    else{
        document.getElementById("message").innerHTML =
        "Incorrect Access Code";
    }

}

</script>

</body>
</html>
