<h1>Order</h1>

<p>
    Submit an order request below.
</p>

    <input
        type="text"
        name="name"
        placeholder="Name"
        required>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required>

    <input
        type="tel"
        name="phone"
        placeholder="Phone Number">

    <textarea
        name="order"
        placeholder="What would you like to order?"
        rows="5"
        required></textarea>

    <textarea
        name="event"
        placeholder="Is this for an event?"
        rows="3"
        required></textarea>

    <button type="submit">
        Submit Request
    </button>

</form>
